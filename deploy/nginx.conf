# Replace app.example.com with the real hostname before installation.
# Certbot adds the HTTPS listener and HTTP redirect after DNS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    client_max_body_size 10m;

    location /static/ {
        alias /opt/vendorops/app/backend/staticfiles/;
        expires 7d;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
